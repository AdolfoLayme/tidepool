<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1314" />
  <meta name="color-scheme" content="dark" />
  <title>Tidepool</title>
  <meta name="description" content="A basalt rock pool on an exposed Pacific shore, in real time: water, light, tide and the animals that live there." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tidepool" />
  <meta property="og:description" content="A rock pool on a Pacific shore, rendered live in your browser. Change the light and the tide, touch the water, tap an animal." />
  <meta property="og:url" content="https://adolfolayme.github.io/tidepool/" />
  <meta property="og:image" content="https://adolfolayme.github.io/tidepool/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <div id="app">
    <div id="scene" role="application" aria-label="Rock pool. Drag to look around, tap the water to make ripples, tap an animal to look closer." tabindex="0"></div>
    <div id="loading" aria-live="polite">Filling the pool</div>
    <div class="wordmark" aria-hidden="true">Tidepool</div>
    <p class="hint" id="hint">Drag to look <span aria-hidden="true">·</span> Tap the water <span aria-hidden="true">·</span> Tap an animal</p>
    <div class="caption" id="caption" hidden>
      <span class="caption-name" id="caption-name"></span>
      <span class="caption-latin" id="caption-latin"></span>
      <button class="caption-back" id="caption-back" type="button">Back</button>
    </div>
    <div class="dock" id="dock">
      <div class="panel" id="panel" hidden>
        <div class="row">
          <label for="light">Light</label>
          <output id="light-label" for="light">Afternoon</output>
        </div>
        <input id="light" type="range" min="0" max="1000" value="650" aria-describedby="light-label" />
        <div class="ticks" aria-hidden="true"><span>Night</span><span>Dawn</span><span>Noon</span><span>Sunset</span><span>Night</span></div>
        <div class="row">
          <label for="tide">Tide</label>
          <output id="tide-label" for="tide">Falling tide</output>
        </div>
        <input id="tide" type="range" min="0" max="1000" value="300" aria-describedby="tide-label" />
        <div class="ticks two" aria-hidden="true"><span>Low</span><span>High</span></div>
      </div>
      <button class="pill" id="pill" type="button" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.2" /><path d="M3 15.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0 4.3-1.6 5 0M3 19.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0 4.3-1.6 5 0" /></svg>
        <span id="pill-text">Afternoon · Falling tide</span>
      </button>
      <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Sound off. Turn on the sound of the shore">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" /><path class="wave" d="M15.5 9.5c1.2 1.4 1.2 3.6 0 5M18 7.5c2.3 2.6 2.3 6.4 0 9" /><path class="mute" d="M16 10l4 4M20 10l-4 4" /></svg>
      </button>
    </div>
    <div id="fallback" hidden><h2>This pool needs WebGL 2</h2><p>Open Tidepool in a current browser with hardware graphics acceleration turned on.</p></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
